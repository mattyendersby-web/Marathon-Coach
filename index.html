<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split — NYC Marathon Coach</title>
<style>
  :root{
    --bg-deep: #0a0e17;
    --surface: #131b2b;
    --surface-raised: #182437;
    --hairline: rgba(245,247,251,0.09);
    --hairline-brass: rgba(58,160,255,0.28);
    --ink-field: #0c1220;
    --parchment: #f5f7fb;
    --parchment-dim: #8d9ab8;
    --brass: #3aa0ff;
    --brass-soft: rgba(58,160,255,0.16);
    --rust: #ff4d4d;
    --rust-deep: #d32f2f;
    --good: #22c55e;
    --bad: #ff4d4d;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --serif: 'Iowan Old Style','Georgia','Times New Roman',serif;
    --sans: 'Helvetica Neue', Arial, sans-serif;
    /* aliases for compatibility with inline styles generated in app.js */
    --lane-dim: var(--parchment-dim);
    --chalk: var(--parchment);
    --gold: var(--brass);
    --clay: var(--rust);
    --clay-dim: var(--rust-deep);
    --ink: var(--ink-field);
    --track: var(--surface);
    --track-light: var(--surface-raised);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(58,160,255,0.09), transparent 60%),
      radial-gradient(ellipse 700px 600px at 100% 0%, rgba(255,77,77,0.08), transparent 55%),
      repeating-linear-gradient(115deg, rgba(245,247,251,0.014) 0px, rgba(245,247,251,0.014) 1px, transparent 1px, transparent 64px),
      var(--bg-deep);
    color: var(--parchment);
    font-family: var(--serif);
    min-height:100vh;
    padding-bottom: 96px;
    -webkit-font-smoothing: antialiased;
  }
  .app{max-width: 720px; margin: 0 auto; padding: 0 18px;}

  header.top{
    padding: 26px 18px 18px;
    border-bottom: 1px solid var(--hairline-brass);
    display:flex; justify-content:space-between; align-items:baseline;
    max-width: 720px; margin:0 auto;
    position: relative;
  }
  header.top .brand{
    font-family: var(--sans);
    font-weight: 700; font-size: 21px; letter-spacing: 0.2px;
    color: var(--parchment);
  }
  header.top .brand .dot{color: var(--brass);}
  header.top .race-date{
    font-family: var(--sans);
    font-size: 12px; color: var(--parchment-dim);
    text-align:right; line-height:1.5;
  }
  header.top .race-date strong{
    color: var(--brass); font-size:16px; font-weight:700;
    font-variant-numeric: tabular-nums;
  }

  main{padding-top: 20px;}
  section.view{display:none;}
  section.view.active{display:block; animation: fadein 0.3s cubic-bezier(.2,.7,.3,1);}
  @keyframes fadein{from{opacity:0; transform: translateY(6px);} to{opacity:1; transform:none;}}

  h1.page-title{
    font-size: 27px; margin: 0 0 4px; font-weight: 600; letter-spacing:-0.2px;
  }
  p.page-sub{color: var(--parchment-dim); margin: 0 0 22px; font-size: 13.5px; font-family: var(--sans);}

  .card{
    background: linear-gradient(180deg, var(--surface), rgba(23,41,34,0.85));
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
    border: 1px solid var(--hairline);
    box-shadow: 0 10px 24px -14px rgba(0,0,0,0.5);
  }
  .card.accent{
    border: 1px solid var(--hairline-brass);
    background:
      radial-gradient(420px 160px at 100% 0%, var(--brass-soft), transparent 65%),
      linear-gradient(180deg, var(--surface-raised), rgba(30,55,43,0.9));
    position: relative;
  }
  .card.accent::before{
    content:''; position:absolute; left:0; top:14px; bottom:14px; width:2px;
    background: linear-gradient(180deg, var(--brass), transparent);
    border-radius: 2px;
  }
  .card h3{
    margin:0 0 12px; font-size:14px; font-weight:600; color: var(--brass);
    font-family: var(--sans); letter-spacing:0.15px;
  }

  .big-stat{
    font-size: 40px; font-weight: 700; line-height: 1;
    font-family: var(--sans); letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .big-stat .unit{font-size:15px; font-weight:400; color:var(--parchment-dim); margin-left:7px; letter-spacing:0;}

  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > *{flex:1; min-width: 120px;}

  label{
    display:block; font-size:12px; color: var(--parchment-dim);
    margin-bottom: 6px; font-family: var(--sans);
  }
  input, select, textarea{
    width:100%; background: var(--ink-field);
    border: 1px solid var(--hairline);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    color: var(--parchment); padding: 11px 13px; border-radius: var(--radius-sm);
    font-family: var(--sans); font-size: 15px;
    margin-bottom: 14px;
  }
  textarea{resize:vertical; min-height: 70px; font-family: inherit;}
  input:focus, select:focus, textarea:focus{outline: 2px solid var(--brass); outline-offset: 1px;}

  button{
    font-family: var(--sans);
    border:none; border-radius: 999px; padding: 12px 20px;
    font-size: 14px; font-weight: 600; cursor:pointer;
    background: linear-gradient(180deg, #bd5a37, var(--rust));
    color: var(--parchment);
    box-shadow: 0 4px 14px -6px rgba(177,80,47,0.55);
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
  }
  button:hover{background: linear-gradient(180deg, var(--rust), var(--rust-deep)); box-shadow: 0 4px 16px -6px rgba(177,80,47,0.7);}
  button:active{transform: translateY(1px);}
  button.ghost{
    background: transparent; border: 1px solid rgba(241,235,219,0.2); color: var(--parchment);
    box-shadow:none;
  }
  button.ghost:hover{background: rgba(241,235,219,0.06); border-color: var(--hairline-brass);}
  button.block{width:100%;}
  button:disabled{opacity:0.35; cursor:not-allowed; box-shadow:none;}

  .pill-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .pill{
    padding: 8px 15px; border-radius: 999px; font-size:13px;
    font-family: var(--sans); cursor:pointer;
    border:1px solid var(--hairline); background: var(--surface); color: var(--parchment-dim);
  }
  .pill.selected{background: var(--brass-soft); border-color: var(--hairline-brass); color: var(--brass); font-weight:600;}

  nav.tabbar{
    position: fixed; bottom:0; left:0; right:0;
    background: rgba(11,20,15,0.92); backdrop-filter: blur(10px);
    border-top: 1px solid var(--hairline-brass);
    display:flex; justify-content: space-around;
    padding: 9px 4px calc(8px + env(safe-area-inset-bottom));
    max-width: 720px; margin: 0 auto;
  }
  nav.tabbar button{
    background:none; box-shadow:none; flex:1; color: var(--parchment-dim); font-size: 10px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding: 6px 1px; font-weight:500; border-radius: var(--radius-sm);
  }
  nav.tabbar button.active{color: var(--brass);}
  nav.tabbar button svg{width:19px; height:19px;}
  nav.tabbar button:hover{background:none;}

  .week-strip{display:flex; gap:7px; overflow-x:auto; padding-bottom:8px; margin-bottom:18px;}
  .day-chip{
    min-width: 54px; text-align:center; padding: 11px 4px;
    border-radius: var(--radius-sm); background: var(--surface);
    border: 1px solid var(--hairline); cursor:pointer;
    font-family: var(--sans);
  }
  .day-chip.today{border-color: var(--brass); box-shadow: 0 0 0 1px var(--hairline-brass);}
  .day-chip.selected{background: var(--brass-soft); border-color: var(--hairline-brass);}
  .day-chip .dow{font-size:10px; color:var(--parchment-dim); letter-spacing:0.4px;}
  .day-chip .num{font-size:16px; font-weight:700; margin: 3px 0; font-variant-numeric: tabular-nums;}
  .day-chip .shift-dot{width:6px; height:6px; border-radius:50%; margin: 2px auto 0;}
  .dot-row{display:flex; gap:3px; justify-content:center; margin-top:3px;}
  .mini-dot{width:5px; height:5px; border-radius:50%;}
  .day-chip.done-day, .month-cell.done-day{
    background: var(--rust) !important;
    border-color: var(--rust) !important;
  }
  .day-chip.done-day .dow, .day-chip.done-day .num,
  .month-cell.done-day{ color: #fff; }

  .session-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding: 13px 0; border-bottom: 1px solid var(--hairline);
  }
  .session-item:last-child{border-bottom:none;}
  .session-item .s-day{font-family: var(--sans); font-size:12px; color:var(--parchment-dim); width:64px; flex-shrink:0; font-variant-numeric: tabular-nums;}
  .session-item .s-desc{flex:1; font-size:14.5px; line-height:1.4;}
  .session-item .s-desc small{display:block; color:var(--parchment-dim); font-size:12px; font-family: var(--sans); margin-top:3px;}
  .session-item.done{opacity:0.45;}
  .session-item.done .s-desc{text-decoration: line-through;}
  .badge{
    font-size:11px; font-family: var(--sans); padding:4px 10px;
    border-radius:999px; font-weight:600; letter-spacing:0.2px; flex-shrink:0;
  }
  .badge.long{background: rgba(255,77,77,0.2); color:#ff8a80;}
  .badge.quality{background: rgba(58,160,255,0.2); color: var(--brass);}
  .badge.easy{background: rgba(34,197,94,0.2); color:#6ee7a0;}
  .badge.rest{background: rgba(245,247,251,0.08); color: var(--parchment-dim);}
  .badge.cross{background: rgba(58,160,255,0.16); color:#8fc4ff;}
  .badge.strength{background: rgba(168,85,247,0.22); color:#d3aeee;}

  .mood-row{display:flex; gap:8px; justify-content:space-between; margin-bottom:16px;}
  .mood-btn{
    flex:1; padding: 14px 4px; text-align:center; border-radius: var(--radius-sm);
    background: var(--surface); border:1px solid var(--hairline); cursor:pointer;
    font-size: 21px; transition: background 0.12s, border-color 0.12s;
  }
  .mood-btn.selected{background: var(--brass-soft); border-color: var(--hairline-brass);}

  .macro-bar{height:7px; background: var(--ink-field); border-radius:4px; overflow:hidden; margin: 7px 0 2px;}
  .macro-bar .fill{height:100%; border-radius:4px;}
  .macro-row{margin-bottom:14px;}
  .macro-row .label-line{display:flex; justify-content:space-between; font-size:13px; font-family: var(--sans);}
  .macro-row .label-line span:last-child{color: var(--parchment-dim); font-variant-numeric: tabular-nums;}

  .chat-log{display:flex; flex-direction:column; gap:12px; margin-bottom:14px; max-height: 55vh; overflow-y:auto; padding-right:4px;}
  .msg{padding:12px 15px; border-radius: 12px; max-width: 85%; font-size:14.5px; line-height:1.55; font-family: var(--serif);}
  .msg.user{background: linear-gradient(180deg, #bd5a37, var(--rust)); align-self:flex-end; border-bottom-right-radius:3px;}
  .msg.coach{background: var(--surface); border: 1px solid var(--hairline); align-self:flex-start; border-bottom-left-radius:3px;}
  .msg.coach::before{content:"Coach"; display:block; font-size:10px; color:var(--brass); font-family: var(--sans); margin-bottom:5px; letter-spacing:0.4px;}
  .chat-input-row{display:flex; gap:8px;}
  .chat-input-row textarea{margin-bottom:0; flex:1; min-height:46px; max-height:120px;}
  .chat-input-row button{border-radius: var(--radius-sm);}
  .mic-active{background: var(--rust) !important; color:#fff !important; animation: micpulse 1.2s infinite;}
  @keyframes micpulse{
    0%{box-shadow: 0 0 0 0 rgba(255,77,77,0.55);}
    70%{box-shadow: 0 0 0 10px rgba(255,77,77,0);}
    100%{box-shadow: 0 0 0 0 rgba(255,77,77,0);}
  }

  .empty{text-align:center; padding: 42px 20px; color: var(--parchment-dim); font-family: var(--sans); font-size:13.5px;}

  .shift-legend{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; font-family: var(--sans); font-size:12px; color:var(--parchment-dim);}
  .shift-legend span{display:flex; align-items:center; gap:5px;}
  .shift-legend .dot{width:8px;height:8px;border-radius:50%;}

  .month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:18px;}
  .month-grid .dow-label{font-size:10px; color:var(--parchment-dim); text-align:center; font-family: var(--sans);}
  .month-cell{
    aspect-ratio:1; border-radius:var(--radius-sm); background:var(--surface);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    cursor:pointer; font-family: var(--sans); font-size:12px;
    border: 1px solid var(--hairline); position:relative; font-variant-numeric: tabular-nums;
  }
  .month-cell.blank{background:transparent; cursor:default; border:none;}
  .month-cell.today{border-color: var(--brass); box-shadow: 0 0 0 1px var(--hairline-brass);}
  .month-cell .dot{width:6px;height:6px;border-radius:50%; position:absolute; bottom:5px;}

  .toast{
    position:fixed; bottom: 104px; left:50%; transform:translateX(-50%);
    background: var(--surface-raised); border:1px solid var(--hairline-brass); color: var(--brass);
    padding:10px 20px; border-radius: 999px;
    font-family: var(--sans); font-size:13px; font-weight:600;
    z-index: 999; opacity:0; pointer-events:none; transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.5);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .key-warning{
    background: rgba(177,80,47,0.1); border:1px solid rgba(177,80,47,0.35);
    padding:13px 15px; border-radius:var(--radius); font-size:13px;
    font-family: var(--sans); margin-bottom:14px; color:#e6ab98;
  }
  .key-warning a, .key-warning button.linklike{color:#f0c4b8; text-decoration:underline; background:none; border:none; padding:0; font:inherit; cursor:pointer;}

  a{color: var(--brass);}
  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background: rgba(241,235,219,0.18); border-radius:3px;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,9,15,0.72);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:1000; animation: fadein 0.2s ease;
  }
  .modal-sheet{
    background: var(--surface-raised);
    width:100%; max-width:720px;
    border-radius: 18px 18px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--hairline-brass);
    box-shadow: 0 -12px 30px -10px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Split<span class="dot">.</span></div>
    <div class="race-date" id="raceCountdown">—</div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabbar">
  <button data-view="today" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    Today
  </button>
  <button data-view="plan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
    Plan
  </button>
  <button data-view="fuel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2c3 3.5 5 6.5 5 9.5a5 5 0 0 1-10 0C7 8.5 9 5.5 12 2z"/></svg>
    Fuel
  </button>
  <button data-view="strength">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7v10M18 7v10M2 10v4M22 10v4M6 12h12"/></svg>
    Strength
  </button>
  <button data-view="coach">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-1L3 20l1-4.5A8.38 8.38 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5z"/></svg>
    Coach
  </button>
  <button data-view="shifts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Shifts
  </button>
  <button data-view="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.67 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.04 4.3l.06.06A1.65 1.65 0 0 0 8.92 4.7H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.3 9c.13.36.36.68.66.94"/></svg>
    Settings
  </button>
</nav>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
